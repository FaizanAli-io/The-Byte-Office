name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # The build needs a DATABASE_URL to exist, but never connects: route
      # handlers read it lazily at request time.
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
